schema_version: 1

context:
  name: trivy
  version: "0.74.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/aquasecurity/${{ name }}/archive/v${{ version }}.tar.gz
    sha256: 04268af574690b84bc3474a5f19e002cd6da3e16899fac9fd39c6e84e7843940
    target_directory: src
  # xi2/xz declares its licensing in prose (public domain), which go-licenses
  # cannot classify, so it is ignored below and its license vendored here.
  - url: https://raw.githubusercontent.com/xi2/xz/refs/heads/master/LICENSE
    sha256: 5c640056d513f276d56635af7a0bed81cb7eac02a31b6e56d40c416557a8d8ce
    file_name: xi2-xz-LICENSE

build:
  number: 0
  script:
    - cd src/cmd/trivy
    - if: unix
      then:
        - export GOEXPERIMENT=jsonv2
        - go build -v -o $PREFIX/bin/trivy -ldflags="-s -w"
        - cp "$(go list -m -f '{{.Dir}}' github.com/in-toto/in-toto-golang)/LICENSE" $SRC_DIR/in-toto-golang-LICENSE
        - cp "$(go list -m -f '{{.Dir}}' github.com/in-toto/attestation)/LICENSE" $SRC_DIR/in-toto-attestation-LICENSE
      else:
        - echo on
        - set GOEXPERIMENT=jsonv2
        - go build -v -o %LIBRARY_BIN%\trivy.exe -ldflags="-s"
        - for /f %%I in ('go list -m -f "{{.Dir}}" github.com/in-toto/in-toto-golang') do copy "%%I\LICENSE" "%SRC_DIR%\in-toto-golang-LICENSE"
        - for /f %%I in ('go list -m -f "{{.Dir}}" github.com/in-toto/attestation') do copy "%%I\LICENSE" "%SRC_DIR%\in-toto-attestation-LICENSE"
    # The ignored modules below have licenses go-licenses cannot classify; their
    # license files are copied in by hand above (see about.license_file).
    - go-licenses save . --save_path ../../../licenses --ignore github.com/aquasecurity/trivy --ignore github.com/xi2/xz --ignore github.com/in-toto/in-toto-golang --ignore github.com/in-toto/attestation

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - trivy --help

about:
  license: Apache-2.0
  license_file:
    - src/LICENSE
    - xi2-xz-LICENSE
    - in-toto-golang-LICENSE
    - in-toto-attestation-LICENSE
    - licenses/
  summary: Trivy is a comprehensive and versatile security scanner. Trivy has scanners that look for security issues, and targets where it can find those issues.
  homepage: https://github.com/aquasecurity/trivy
  documentation: https://aquasecurity.github.io/trivy/

extra:
  recipe-maintainers:
    - mediocretech
    - fhoehle
    - xhochy
